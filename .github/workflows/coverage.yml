name: Coverage

# Unit-test coverage of the root module, uploaded to Codecov with GitHub OIDC,
# so no CODECOV_TOKEN secret is stored. Pull requests from forks get no OIDC
# token; codecov-action detects the fork and uploads tokenless, which Codecov
# accepts for public repositories. Everything Codecov reports is informational
# (codecov.yml), and this job is not a required check.
#
# The internal/integrationtest/testserver module has no tests of its own, so
# there is nothing to measure there.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      # No -race here: the Test job in ci.yml already runs the suite under the
      # race detector. atomic is the covermode that stays correct when the
      # counted code runs on many goroutines, and -coverpkg=./... credits the
      # root package for the lines checkpoint's tests reach too.
      - name: Unit tests with coverage
        run: go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out -timeout 300s ./...
      - name: Coverage profile is not empty
        run: |
          test -s coverage.out
          blocks=$(($(wc -l < coverage.out) - 1))
          echo "coverage.out: ${blocks} blocks"
          test "$blocks" -gt 0
          go tool cover -func=coverage.out | tail -n 1
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage.out
          disable_search: true
          flags: unit
          fail_ci_if_error: true
