name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
      - name: actionlint
        # Workflow-YAML lint: catches script-injection vectors, unknown
        # runner labels, malformed shell, action input misuse — the
        # whole class golangci-lint can't see.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          actionlint -color

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Run tests
        run: go test -race -count=1 -timeout 120s ./...

  integration:
    name: Integration (live celeris)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      # The testserver helper imports github.com/goceleris/celeris (pinned in
      # go.mod). Integration tests spawn it as a subprocess per matrix cell,
      # then drive loadgen against the live server via the library API. -race
      # catches concurrency regressions in the upgrade + mix dispatch paths.
      - name: Run integration matrix
        run: go test -tags integration -race -count=1 -timeout 180s -v -run TestIntegrationH2CMatrix .
