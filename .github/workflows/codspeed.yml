name: CodSpeed

# Continuous benchmarking of the root package's testing.B benchmarks on a
# CodSpeed macro runner (walltime instrument, the only one CodSpeed's Go
# integration supports). Results appear on the PR as the "CodSpeed Performance
# Analysis" check, which is informational until it is made a required check.
#
# Runner: codspeed-macro-arm64-graviton-ubuntu-22-04, the macro runner CodSpeed's
# free plan includes (600 minutes a month, shared by every goceleris repository).
# The x64 Ryzen macro runner is not available on the free plan. A PR is only
# compared with main runs made on this same runner.
#
# Budget: the benchmarks only live in the root package, so this runs only when a
# root-level .go file, go.mod or go.sum changes; drafts and superseded PR pushes
# are skipped. See goceleris/celeris#690 for the estimate.
#
# Prerequisites, all done on 2026-09-26 (goceleris/celeris#690): this
# repository in the org's Default runner group with public repositories
# allowed, CodSpeedHQ/action@* on the Actions allow-list, and the repository
# enabled in CodSpeed. Without the first, the job waits in the queue with no
# runner.
#
# Security: a macro runner is a self-hosted runner outside GitHub's sandbox.
# The job's `if:` below skips fork pull requests, a deleted fork's included
# (its head.repo is null, and null == the repository name is false), but it
# is not the security boundary: on `pull_request` the workflow definition
# comes from the pull request's merge ref, so a fork pull request can edit
# this file, or add a workflow of its own, and target the macro runner. What
# stops it is the fork-PR approval policy, "Require approval for all external
# contributors" (`gh api repos/goceleris/loadgen/actions/permissions/fork-pr-contributor-approval`
# returns all_external_contributors). That setting must stay, and a
# maintainer must never "Approve and run" a fork pull request that touches
# .github/. The policy does not hold an organization member's fork pull
# request for approval, and the organization's base permission is read: a
# member with read access here can run one on the macro runner with no
# approval at all, which only a settings change closes (goceleris/celeris#864).

on:
  push:
    branches: [main]
    paths:
      - "*.go"
      - go.mod
      - go.sum
      - .github/workflows/codspeed.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "*.go"
      - go.mod
      - go.sum
      - .github/workflows/codspeed.yml
  # Lets CodSpeed trigger backtests of past commits, and a maintainer run it by
  # hand.
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Benchmarks (CodSpeed walltime, arm64 macro runner)
    # Skips fork pull requests as this file is written (the approval policy
    # in the header is what holds against a fork that edits it) and drafts,
    # which wait until they are ready.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft)
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # CodSpeed OIDC upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          # go-runner 1.3.0 is the first release that supports Go 1.27. It is
          # pinned so a runner upgrade cannot shift the measurements unannounced.
          go-runner-version: "1.3.0"
          # -benchtime=1s matches plain `go test -bench` (the go-runner defaults
          # to 3s): it keeps local and CodSpeed numbers comparable, costs about
          # 40 s less per run, and keeps BenchmarkH2CUpgradeDial, which opens a
          # TCP connection per iteration, below ephemeral-port exhaustion.
          run: go test -bench=. -benchtime=1s .
