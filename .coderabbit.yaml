# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration for goceleris/loadgen.
# Reference: https://docs.coderabbit.ai/reference/configuration
#
# CodeRabbit reads this file from the branch under review, so a PR that edits
# it is reviewed with its own version. Every key below is checked against the
# schema named on the first line; keys left out keep CodeRabbit's defaults.
#
# Nothing here blocks a merge: request_changes_workflow is off and every
# pre-merge check is at most a warning. Tracking issue: goceleris/celeris#690.

language: en-US

reviews:
  # chill: correctness findings, without the style nits golangci-lint already
  # enforces in CI.
  profile: chill
  request_changes_workflow: false

  # Walkthrough comment: the summary goes into it rather than into the PR
  # description, so the author's filled-in PR template is left untouched.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  in_progress_fortune: false
  # review_details lists the config file, profile and tools a review used,
  # which is how a reviewer can tell this file was read.
  review_status: true
  review_details: true

  # One maintainer, and CODEOWNERS already requests the review.
  suggested_reviewers: false
  auto_assign_reviewers: false

  suggested_labels: true
  auto_apply_labels: false
  labeling_instructions:
    - label: performance
      instructions: >-
        The PR changes a hot path (request encode/send, response read/parse,
        latency recording, stream dispatch) or a benchmark, and states a
        measured effect.
    - label: breaking
      instructions: >-
        The PR removes or renames an exported identifier, changes an exported
        signature, removes or renames a CLI flag, or removes or renames a field
        of the JSON Result schema.
    - label: api
      instructions: The PR adds or changes exported Go API (Config, Result, Client, recorder or histogram helpers).
    - label: bug
      instructions: The PR fixes incorrect behaviour or an incorrect measurement.
    - label: testing
      instructions: The PR only adds or changes tests or benchmarks.
    - label: docs
      instructions: The PR only changes documentation (README, doc comments, CONTRIBUTING, SECURITY).
    - label: security
      instructions: The PR changes TLS handling, workflow permissions, or anything that parses untrusted network input.
    - label: dx
      instructions: The PR changes developer tooling, CI workflows or repository configuration without changing the library or the CLI.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - WIP
      - DO NOT REVIEW
    # Grouped dependency bumps are reviewed on request (@coderabbitai review)
    # so they do not spend the open-source review allowance.
    ignore_usernames:
      - "dependabot[bot]"

  pre_merge_checks:
    # Go has doc comments, not docstrings; the percentage would count every
    # test and benchmark function and warn on nearly every PR.
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        Conventional-commit style, as in this repository's history:
        type(optional-scope): summary in the imperative, where type is one of
        feat, fix, perf, security, test, ci, docs, chore, build or refactor.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - mode: warning
        name: README cluster-bench contract
        instructions: >-
          Pass unless the PR adds, removes, renames or changes the JSON tag or
          meaning of a field of loadgen.Result or of a type nested in it
          (results.go and the types it references), or adds, removes or renames
          a flag or changes a flag default in cmd/loadgen/main.go. In that case
          pass only if README.md is changed in the same PR in the
          "Cluster-bench integration contract" section (JSON output schema
          table) or the "Flags" table respectively, matching the code.
          probatorium parses this output, so the README is the contract.

  path_instructions:
    - path: "**/*.go"
      instructions: |
        loadgen is the measurement instrument for the celeris benchmark suite: a
        bug here produces a wrong number that looks like a server result. Review
        for measurement correctness first, then for hot-path cost.
        - Latency must be measured with the monotonic clock (time.Now /
          time.Since); flag wall-clock arithmetic, Unix()/UnixNano() differences,
          or time.Time values that lost their monotonic reading (Round(0),
          serialisation round trips) being subtracted.
        - A request must be counted exactly once: as a success, an error, or a
          connect error. Flag paths that drop, double count, or count warmup
          traffic inside the measurement window.
        - Anything that makes the client the bottleneck (a lock, a channel hop,
          a syscall, an allocation) on the per-request path distorts the result.
          Point it out with the path it is on.
        - Errors must not be swallowed: an ignored error on a read or write
          means a failed request is recorded as a success.
        - Goroutines started per connection or per stream must end when the run
          context is cancelled; a leak skews later runs in the same process.
    - path: "{bench,mix,backoff,dial}.go"
      instructions: |
        Scheduling and rate control.
        - Rated mode is closed-loop with coordinated-omission correction:
          latency is measured from the scheduler's intended dispatch time, not
          from the moment a worker sent the request. Flag any change that
          records from the actual send time, skips or coalesces missed slots,
          or lets the schedule slip to the server's pace.
        - -rate (closed loop, intended-time latency) and -max-rps (open-loop
          token bucket) are independent; flag changes that couple them.
        - Timer accuracy: flag time.Sleep or a ticker used as a rate source,
          timers that are created per request without being stopped, and
          period arithmetic that truncates (for example integer division of
          time.Second by the rate).
        - Warmup and measurement windows must not overlap, and counters reset
          at the boundary must be reset atomically with respect to workers.
        - Mix dispatch is deterministic from a seeded PCG; flag uses of the
          global math/rand source or time-based seeds.
    - path: "{latency,results,federation}.go"
      instructions: |
        Latency recording and the result schema.
        - HdrHistogram values are nanoseconds (hdrLowestTrackable = 1,
          hdrHighestTrackable = 30 s, 3 significant digits, see newHistogram).
          recordHist deliberately clamps out-of-range samples to the range
          instead of dropping them, so the tail mass stays visible. Flag values
          recorded in another unit, a change that drops out-of-range samples,
          and merges of histograms created with different parameters.
        - Percentiles must come from the merged histogram of all shards, and a
          shard must be single-writer: flag a second writer or a read of a
          shard that is still being written without the per-shard lock.
        - The exported histogram is V2-compressed and base64 in JSON; federation
          uses the same encoding on the wire. Flag encoding changes that break
          round-tripping with DecodeHistogram.
        - loadgen.Result is parsed by probatorium: a renamed or removed JSON tag
          or a changed unit is a breaking change, and every field change must be
          reflected in the README contract section.
    - path: "{h1client,h2client,h2framer,h2c_upgrade,ws,sse,recvq,recvq_other,cpumon,cpumon_other}.go"
      instructions: |
        Protocol clients and probes (the send/receive hot path).
        - The request/response cycle is built to be allocation-free: request
          bytes are pre-formatted, HPACK headers pre-encoded, and H2 status
          codes read from the encoded header block. Flag new allocations on the
          per-request path (fmt, string concatenation, []byte conversions,
          closures that escape, interface boxing, defer in hot loops) and ask
          for a benchmark with ReportAllocs when one is added.
        - HTTP/2: check stream ID allocation (odd, increasing, never reused),
          flow-control accounting (connection and stream windows, batched
          WINDOW_UPDATE), SETTINGS acknowledgement, GOAWAY and RST_STREAM
          handling, and that a response is delivered to exactly one waiter.
        - h2c upgrade (RFC 7540 section 3.2): the HTTP2-Settings header must be
          base64url without padding, the upgraded request is stream 1, and the
          client preface must be sent before any other frame.
        - HTTP/1.1: response framing (Content-Length, chunked, Connection:
          close) must be parsed exactly; a mis-framed body desynchronises every
          later response on the connection.
        - Build-tagged pairs (cpumon.go / cpumon_other.go, recvq.go /
          recvq_other.go) must keep the same exported surface.
    - path: "cmd/loadgen/**"
      instructions: |
        CLI contract (README "Cluster-bench integration contract"): stdout is a
        single JSON Result and nothing else; progress and logs go to stderr;
        exit 0 when the run completed (including SIGINT/SIGTERM, which still
        print the partial Result); non-zero only for configuration errors.
        Flag anything that writes to stdout outside the final JSON, changes an
        exit code, or renames or removes a flag or changes its default without
        a README update.
    - path: "checkpoint/**"
      instructions: |
        Checkpoint files persist results so an interrupted benchmark suite can
        resume without re-running completed configurations. Flag changes that
        make an existing checkpoint file unreadable, that skip or repeat a
        configuration on resume, and missing validation of fields read from
        disk.
    - path: "**/*_test.go"
      instructions: |
        - Tests must be deterministic: flag time.Sleep used for
          synchronisation, unseeded randomness, fixed ports, and assertions on
          wall-clock durations tight enough to fail on a loaded CI runner.
        - CI runs go test -race; flag data races introduced by the test itself.
        - Benchmarks run on CodSpeed (walltime, macro runner) as well as
          locally. Prefer b.Loop(), keep setup outside the loop, and call
          b.ReportAllocs() for hot-path benchmarks. CodSpeed's Go runner only
          honours -bench and -benchtime (codspeed.yml sets 1s), so a benchmark
          must not depend on -cpu, -count or -benchmem. A benchmark that opens
          a connection per iteration must stay within the ephemeral port range
          at that benchtime. Renaming a benchmark starts a new series on
          CodSpeed and loses its history.
        - A correctness fix needs a regression test that fails without the fix.
    - path: "internal/integrationtest/**"
      instructions: |
        A nested module that pins its own celeris and is spawned as a
        subprocess by the integration tests. It is never imported by loadgen.
        Keep celeris out of the root go.mod.
    - path: ".github/workflows/**"
      instructions: |
        - Every uses: is pinned to a full commit SHA with a version comment (the
          repository requires SHA pinning).
        - Top-level permissions are read-only; id-token: write only on the job
          that uploads (Codecov, CodSpeed).
        - actions/checkout sets persist-credentials: false.
        - No ${{ }} expressions inside run: blocks; pass values through env:.
        - Never use pull_request_target. Code from a fork must never run on a
          self-hosted or CodSpeed macro runner.
        - Do not change the run: steps of ci.yml or release.yml without saying
          why in the PR description.
    - path: "{version.go,scripts/check-release-stamps.sh}"
      instructions: |
        fallbackVersion in version.go and the download tag in README.md must
        agree; the Release workflow refuses to tag while they disagree.

  tools:
    golangci-lint:
      enabled: true
      config_file: .golangci.yml
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    osvScanner:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true
  art: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md
  # loadgen's consumers and its target. Order matters: only the first N
  # entries allowed by the plan are used.
  linked_repositories:
    - repository: goceleris/probatorium
      instructions: >-
        The benchmark harness that imports loadgen as a library and parses the
        CLI's JSON Result (cmd/loadgen, cmd/runner, mage_bench*.go). Check it
        for breakage when loadgen's exported API, Result fields or CLI flags
        change.
    - repository: goceleris/celeris
      instructions: >-
        The HTTP engine loadgen measures, and the server the integration
        testserver runs. Use it to check protocol behaviour (h2c upgrade, HTTP/2
        flow control, WebSocket, SSE) that a loadgen client depends on.

issue_enrichment:
  planning:
    auto_planning:
      enabled: false
